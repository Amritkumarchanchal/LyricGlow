<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:;" />
  <title>LyricGlow</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
    #frame { position: absolute; inset: 0; border-radius: 14px; overflow: hidden;
      background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(12px);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
    #view { width: 100%; height: 100%; display: block; }
    video { display: none; }

    /* Drag the whole window by its background (disabled while click-through). */
    #drag { position: absolute; inset: 0; -webkit-app-region: drag; }
    body.select #drag, body.picking #drag, body.clickthrough #drag { display: none; }

    #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; color: #ddd; font-size: 13px; padding: 16px; line-height: 1.5;
      pointer-events: none; }

    #picker { position: absolute; inset: 0; background: rgba(20,20,20,.95); color: #eee;
      padding: 10px; overflow: auto; display: none; -webkit-app-region: no-drag; }
    body.picking #picker { display: block; }
    #picker h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
    #picker button { display: block; width: 100%; text-align: left; margin: 3px 0; padding: 6px 8px;
      background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; font-size: 12px; cursor: pointer; }
    #picker button:hover { background: #3a3a3a; }

    #selectBox { position: absolute; border: 2px solid #1db954; background: rgba(29,185,84,.18);
      display: none; pointer-events: none; }
    #hint { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #9f9;
      display: none; pointer-events: none; text-shadow: 0 0 4px #000; }
    body.select #hint { display: block; }
    body.select #view { cursor: crosshair; }

    #badge { position: absolute; top: 6px; right: 8px; font-size: 10px; color: #aaa; display: none;
      pointer-events: none; }
    body.clickthrough #badge { display: block; }

  </style>
</head>
<body>
  <div id="frame">
    <canvas id="view"></canvas>
    <video id="vid" muted playsinline></video>
    <div id="drag"></div>
    <div id="selectBox"></div>
    <div id="msg"></div>
    <div id="hint">Drag a box around the lyrics, then release</div>
    <div id="badge">click-through on (⌘⇧K)</div>
    <div id="picker"><h4>Pick the Spotify window</h4><div id="list"></div></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
